[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-shipgate-commercial"

# BUILD_MAP § 4.1 item 7: no stubs. sg-packs additionally denies clippy::panic in its crate root.
[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 16
